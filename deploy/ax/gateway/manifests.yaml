apiVersion: v1
kind: Namespace
metadata:
  name: glue-system
  labels:
    ate.dev/api-access: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glue-gateway
  namespace: glue-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glue-gateway-state
  namespace: glue-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: glue-gateway-config
  namespace: glue-system
data:
  config.yaml: |
    listen: 0.0.0.0:8080
    state_dir: /var/lib/glue-gateway
    auth:
      mode: dev-token
    default_backend: ax
    backends:
      - name: ax
        type: ax
        atespace: default
        image: ${GLUE_TASK_IMAGE}
        resources:
          cpu: "4"
          memory: "8Gi"
        ax_server: ax-server.${AX_SYSTEM_NAMESPACE}.svc.cluster.local:8080
        substrate: api.ate-system.svc.cluster.local:443
        router: atenet-router.ate-system.svc.cluster.local:8444
        cert_file: /run/podidentity.podcert.ate.dev/credential-bundle.pem
        ca_file: /run/servicedns-ca/trust-bundle.pem
        token_file: /var/run/secrets/ateapi/token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glue-gateway
  namespace: glue-system
  labels:
    app.kubernetes.io/name: glue-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: glue-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glue-gateway
    spec:
      serviceAccountName: glue-gateway
      containers:
        - name: glue-gateway
          image: ${GLUE_GATEWAY_IMAGE}
          imagePullPolicy: IfNotPresent
          args:
            - "--config=/etc/glue-gateway/config.yaml"
          env:
            - name: GLUE_SUSPEND_AFTER
              value: "${GLUE_SUSPEND_AFTER}"
          envFrom:
            - secretRef:
                name: glue-gateway-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/glue-gateway
              readOnly: true
            - name: state
              mountPath: /var/lib/glue-gateway
            - name: ate-token
              mountPath: /var/run/secrets/ateapi
              readOnly: true
            - name: servicedns-ca
              mountPath: /run/servicedns-ca
              readOnly: true
            - name: podidentity
              mountPath: /run/podidentity.podcert.ate.dev
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: glue-gateway-config
        - name: state
          persistentVolumeClaim:
            claimName: glue-gateway-state
        - name: ate-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 7200
                  path: token
        - name: servicedns-ca
          projected:
            defaultMode: 420
            sources:
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: servicedns.podcert.ate.dev/identity
        - name: podidentity
          projected:
            defaultMode: 420
            sources:
              - podCertificate:
                  credentialBundlePath: credential-bundle.pem
                  keyType: ECDSAP256
                  signerName: podidentity.podcert.ate.dev/identity
---
apiVersion: v1
kind: Service
metadata:
  name: glue-gateway
  namespace: glue-system
  labels:
    app.kubernetes.io/name: glue-gateway
spec:
  selector:
    app.kubernetes.io/name: glue-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: http-8080
      port: 8080
      targetPort: 8080
